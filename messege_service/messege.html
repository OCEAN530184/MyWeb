<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="css/style3.css" rel="stylesheet">
</head>

<body>
    <div class="main">
        <h1 class="title">진심을 담아 전달해보세요.</h1>
        <div class="textbox">
            <form>
                <div id="btn">
                    <input type="radio" name="font" id="GeuriunOmiriHandwriting">
                    <label for="GeuriunOmiriHandwriting">부드러운 글씨로 쓰기</label>
                    <input type="radio" name="font" id="NostalgicPoliceHumanRights">
                    <label for="NostalgicPoliceHumanRights">단정한 글씨로 쓰기</label>
                </div>
                <div class="receiver">
                    <label for="receiver">어떻게 보내시겠어요?</label>
                    <input type="email" id="receiver" name="receiver" placeholder="받는 분의 메일을 입력해주세요.">
                </div>
                <div id="textin">
                    <textarea rows="10" cols="40" id="msg" placeholder="편지의 내용을 입력해주세요."></textarea>
                </div>
                <button type="submit" class="send-letter-button">
                    편지 보내기 &lt;
                </button>
            </form>
        </div> <!--textbox-->
    </div>
</body>

</html>
